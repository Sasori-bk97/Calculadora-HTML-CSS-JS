<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <!-- Aponta para a pasta css/ -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <div class="card">
        <h1>Calculadora de Desconto</h1>
        
        <label for="preco">Preço do Produto (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 100">

        <button id="btnCalcular">Calcular 10% de Desconto</button>

        <h2 id="resultado"></h2>
    </div>

    <!-- Aponta para a pasta js/ -->
    <script src="js/script.js"></script>
</body>
</html>
